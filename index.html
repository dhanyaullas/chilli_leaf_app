
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chilli Leaf Disease Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: Arial; padding: 16px; text-align: center; }
    h2 { color: #216e39; }
    img { max-width: 100%; max-height: 260px; margin-top: 12px; }
    button { padding: 12px; margin-top: 12px; }
    #result { margin-top: 16px; padding: 14px; background: #eef7ee; }
  </style>
</head>
<body>
  <h2>Chilli Leaf Disease Detection</h2>
  <p>Select a chilli leaf photo and classify it.</p>

  <input id="photo" type="file" accept="image/*">
  <br>
  <img id="preview" hidden>
  <br>
  <button id="classify" disabled>Classify Leaf</button>
  <p id="status">Loading model...</p>
  <div id="result">Prediction will appear here.</div>

  <script>
    let model;
    const base = "./";

    async function start() {
      try {
        model = await tmImage.load(
          base + "model.json",
          base + "metadata.json"
        );
        document.getElementById("status").textContent =
          "Model loaded. Select a leaf photo.";
      } catch (e) {
        document.getElementById("status").textContent =
          "Model loading failed. Check model files and hosting.";
        console.error(e);
      }
    }

    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const button = document.getElementById("classify");

    photo.addEventListener("change", () => {
      const file = photo.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      preview.onload = () => button.disabled = !model;
    });

    button.addEventListener("click", async () => {
      if (!model || !photo.files[0]) return;
      document.getElementById("status").textContent = "Classifying...";
      try {
        const predictions = await model.predict(preview);
        predictions.sort((a, b) => b.probability - a.probability);
        const best = predictions[0];
        const confidence = (best.probability * 100).toFixed(1);
        document.getElementById("result").innerHTML =
          "<h3>Prediction: " + best.className + "</h3>" +
          "<p>Confidence: " + confidence + "%</p>";
        document.getElementById("status").textContent = "Classification complete.";
      } catch (e) {
        document.getElementById("status").textContent =
          "Classification failed. Check the browser console.";
        console.error(e);
      }
    });

    start();
  </script>
</body>
</html>
